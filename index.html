<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PixoraAI - AI Image & Video Studio</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0b0c1b;
            color: #ffffff;
            overflow-x: hidden;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 8%;
            background: rgba(11, 12, 27, 0.85);
            backdrop-filter: blur(10px);
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .logo {
            font-size: 24px;
            font-weight: 700;
            background: linear-gradient(90deg, #a855f7, #6366f1);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .nav-right {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .user-circle-btn {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            background: #1e1b4b;
            border: 2px solid #6366f1;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #a855f7;
            cursor: pointer;
            transition: 0.3s;
            overflow: hidden; /* Profile pic ke liye */
        }

        .user-circle-btn img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .hero {
            display: flex;
            flex-wrap: wrap;
            padding: 50px 8%;
            gap: 40px;
            align-items: center;
            justify-content: space-between;
        }

        .hero-left {
            flex: 1;
            min-width: 320px;
        }

        .badge {
            background: rgba(99, 102, 241, 0.15);
            color: #a855f7;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 12px;
            display: inline-block;
            margin-bottom: 20px;
            border: 1px solid rgba(168, 85, 247, 0.3);
        }

        .hero-title {
            font-size: 42px;
            line-height: 1.2;
            margin-bottom: 15px;
            font-weight: 800;
        }

        .hero-title span {
            background: linear-gradient(90deg, #38bdf8, #818cf8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .hero-desc {
            color: #94a3b8;
            font-size: 15px;
            margin-bottom: 25px;
            line-height: 1.6;
        }

        .hero-right {
            flex: 1;
            min-width: 340px;
            background: #131129;
            padding: 20px;
            border-radius: 16px;
            border: 1px solid #2e285a;
        }

        .preview-container {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
        }

        .main-preview {
            flex: 3;
            position: relative;
            height: 280px;
            border-radius: 12px;
            overflow: hidden;
            background: #000;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .main-preview img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: opacity 0.5s;
        }

        .main-preview video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: none;
        }

        .loading-spinner {
            display: none;
            position: absolute;
            color: #a855f7;
            font-size: 32px;
            z-index: 5;
        }

        .preview-badge {
            position: absolute;
            top: 10px;
            left: 10px;
            background: rgba(0,0,0,0.7);
            padding: 4px 8px;
            font-size: 10px;
            border-radius: 4px;
            font-weight: 700;
            z-index: 4;
        }

        .side-thumbnails {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .thumb {
            width: 100%;
            height: 60px;
            border-radius: 8px;
            object-fit: cover;
            cursor: pointer;
            border: 2px solid transparent;
        }

        .thumb.active {
            border-color: #8b5cf6;
        }

        .control-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 15px;
        }

        .select-field {
            background: #1c1936;
            border: 1px solid #3730a3;
            color: #cbd5e1;
            padding: 8px 12px;
            border-radius: 8px;
            font-size: 13px;
            outline: none;
            width: 100%;
        }

        .prompt-container {
            margin-bottom: 15px;
        }

        .prompt-input {
            width: 100%;
            background: #1c1936;
            border: 1px solid #3730a3;
            border-radius: 10px;
            padding: 12px 15px;
            color: #ffffff;
            font-size: 14px;
            outline: none;
        }

        .script-input {
            width: 100%;
            background: #1c1936;
            border: 1px solid #3730a3;
            border-radius: 10px;
            padding: 12px 15px;
            color: #ffffff;
            font-size: 14px;
            outline: none;
            height: 100px;
            resize: none;
            display: none;
        }

        .action-row {
            display: flex;
            gap: 10px;
        }

        .btn-gen {
            flex: 1;
            background: linear-gradient(90deg, #8b5cf6, #6366f1);
            border: none;
            color: #fff;
            padding: 12px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-down {
            flex: 1;
            background: #1e1b4b;
            border: 1px solid #6366f1;
            color: #a855f7;
            padding: 12px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        footer {
            margin-top: 50px;
            padding: 30px 8%;
            background: #080811;
            border-top: 1px solid #1a1830;
            text-align: center;
            color: #64748b;
            font-size: 14px;
        }

        footer strong {
            color: #a855f7;
        }
    </style>
    <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>

    <header>
        <div class="logo">PixoraAI</div>
        <div class="nav-right">
            <div class="user-circle-btn" id="userBtn" onclick="toggleAuth()" title="User Profile. Click to Login.">
                <i class="fa-solid fa-user" id="authIcon"></i>
            </div>
        </div>
    </header>

    <div class="hero">
        <div class="hero-left">
            <div class="badge"><i class="fa-solid fa-wand-magic-sparkles"></i> AI 4K Generation Studio</div>
            <h1 class="hero-title">Create Stunning <span>AI Visuals</span></h1>
            <p class="hero-desc">
                Type your prompt or script below, choose your style and format, and click Generate to create high-resolution content instantly.
            </p>
        </div>

        <div class="hero-right">
            <div class="preview-container">
                <div class="main-preview">
                    <span class="preview-badge" id="resBadge">4K ULTRA HD</span>
                    <i class="fa-solid fa-spinner fa-spin loading-spinner" id="loader"></i>
                    
                    <video id="mainVideo" controls></video>
                    <img id="mainImage" src="https://image.pollinations.ai/prompt/hyperrealistic%20lion%20and%20bear%20nature%20cinematic%204k?width=600&height=400&nologo=true" alt="Main Output">
                </div>
                <div class="side-thumbnails">
                    <img class="thumb active" src="https://image.pollinations.ai/prompt/cyberpunk%20warrior%20anime%204k?width=150&height=100&nologo=true" onclick="selectThumb(this)">
                    <img class="thumb" src="https://image.pollinations.ai/prompt/scifi%20futuristic%20city%204k?width=150&height=100&nologo=true" onclick="selectThumb(this)">
                    <img class="thumb" src="https://image.pollinations.ai/prompt/magical%20fantasy%20castle%204k?width=150&height=100&nologo=true" onclick="selectThumb(this)">
                </div>
            </div>

            <div class="control-grid">
                <select class="select-field" id="typeSelect" onchange="toggleInputMode()">
                    <option value="image">Text to Image</option>
                    <option value="video">Text to Video</option>
                </select>

                <select class="select-field" id="ratioSelect">
                    <option value="1280x720">YouTube (16:9 4K)</option>
                    <option value="720x1280">YouTube Shorts / Reels (9:16)</option>
                    <option value="1024x1024">Facebook / Logo (1:1)</option>
                    <option value="1280x720">YouTube Thumbnail</option>
                </select>

                <select class="select-field" id="styleSelect" style="grid-column: span 2;">
                    <option value="ultra realistic, 8k photography, sharp focus">Ultra Realistic</option>
                    <option value="cinematic movie lighting, 4k render">Cinematic Movie Style</option>
                    <option value="3D Pixar animation cartoon style">Cartoon / 3D Animation</option>
                    <option value="dramatic lighting story cinematic">Cinematic Story</option>
                </select>
            </div>

            <div class="prompt-container">
                <input type="text" id="promptText" class="prompt-input" value="Prompt" onfocus="if(this.value=='Prompt')this.value=''" placeholder="Enter what you want to create...">
                <textarea id="scriptText" class="script-input" placeholder="Enter your full story script here (up to 10 minutes)..."></textarea>
            </div>

            <div class="action-row">
                <button class="btn-gen" onclick="generateAsset()"><i class="fa-solid fa-wand-magic-sparkles"></i> Generate</button>
                <button class="btn-down" onclick="downloadAsset()"><i class="fa-solid fa-download"></i> Download</button>
            </div>
        </div>
    </div>

    <footer>
        <p>© 2026 PixoraAI Studio. All rights reserved.</p>
        <p style="margin-top: 8px;">Website Created & Developed by: <strong>Kamlesh Meena</strong></p>
    </footer>

    <script>
        // --- AAPKA NAYA CLIENT ID YAHAN SET HAI ---
        const GOOGLE_CLIENT_ID = "239528284719-gt2p1g7mgqn5ufl7pjfcj1i2c36p14pj.apps.googleusercontent.com"; 
        // ------------------------------------------

        const mainImg = document.getElementById('mainImage');
        const mainVideo = document.getElementById('mainVideo');
        const loader = document.getElementById('loader');
        const typeSelect = document.getElementById('typeSelect');
        const promptInput = document.getElementById('promptText');
        const scriptInput = document.getElementById('scriptText');
        const authIcon = document.getElementById('authIcon');
        const userBtn = document.getElementById('userBtn');

        // Page load par check karein ki user pehle se login hai ya nahi
        window.onload = function () {
            initializeGoogleSignIn();
            const savedUser = localStorage.getItem('pixoraUser');
            if (savedUser) {
                const user = JSON.parse(savedUser);
                updateUIForLoggedInUser(user);
            }
        };

        function initializeGoogleSignIn() {
            google.accounts.id.initialize({
                client_id: GOOGLE_CLIENT_ID,
                callback: handleCredentialResponse,
                auto_select: false // Aapne kaha ki har baar list dikhe, auto-select nahi
            });
        }

        // Login handle karne wala function
        function handleCredentialResponse(response) {
            // Google se mili credential ko decode karein (User info nikalne ke liye)
            const responsePayload = parseJwt(response.credential);
            
            const userData = {
                name: responsePayload.name,
                email: responsePayload.email,
                picture: responsePayload.picture
            };

            // User data ko browser me hamesha ke liye save karein (Local Storage)
            localStorage.setItem('pixoraUser', JSON.stringify(userData));
            updateUIForLoggedInUser(userData);
            alert("Sarpaltapurvak login hua: " + userData.name);
        }

        // UI ko login user ke hisab se update karein
        function updateUIForLoggedInUser(user) {
            // User ki profile picture dikhayein
            userBtn.innerHTML = `<img src="${user.picture}" alt="${user.name}">`;
            userBtn.title = `Logged in as ${user.name} (${user.email}). Click to Logout.`;
            // Ab click karne par logout hoga
            userBtn.setAttribute('onclick', 'handleLogout()');
        }

        // Jab user login icon par click karega (starting me)
        function toggleAuth() {
            // Agar pehle se login hai, toh `handleLogout` call hoga (updateUIForLoggedInUser set karta hai)
            // Agar login nahi hai, toh ye function call hoga aur Google ID list khulegi
            google.accounts.id.prompt(); // Ye automatic Gmail account list dikhata hai
        }

        // Logout function
        function handleLogout() {
            const confirmLogout = confirm("Kya aap logout karna chahte hain?");
            if (confirmLogout) {
                localStorage.removeItem('pixoraUser'); // Saved data hatayein
                google.accounts.id.disableAutoSelect(); // Auto-login band karein

                // Icon ko firse purana jaisa banayein
                userBtn.innerHTML = `<i class="fa-solid fa-user" id="authIcon"></i>`;
                userBtn.title = "User Profile. Click to Login.";
                userBtn.setAttribute('onclick', 'toggleAuth()');
                
                alert("Aap logout ho gaye hain. Ab aap kisi dusri Gmail ID se login kar sakte hain.");
            }
        }

        // Helper function: JWT token ko decode karne ke liye
        function parseJwt(token) {
            var base64Url = token.split('.')[1];
            var base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
            var jsonPayload = decodeURIComponent(atob(base64).split('').map(function(c) {
                return '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2);
            }).join(''));
            return JSON.parse(jsonPayload);
        }

        // --- BAKI PURENE GENERATION FUNCTION (Inhein waisa hi rahne dein) ---

        function toggleInputMode() {
            if (typeSelect.value === 'video') {
                promptInput.style.display = 'none';
                scriptInput.style.display = 'block';
                scriptInput.value = "Script"; // Resetting script value
            } else {
                promptInput.style.display = 'block';
                scriptInput.style.display = 'none';
                promptInput.value = "Prompt"; // Resetting prompt value
            }
        }

        function generateAsset() {
            if (typeSelect.value === 'image') {
                generateImage();
            } else {
                generateVideo();
            }
        }

        function generateImage() {
            let prompt = promptInput.value.trim();
            if (!prompt || prompt === "Prompt") {
                alert("Kripya prompt bar me kuch likhein!");
                return;
            }

            const style = document.getElementById('styleSelect').value;
            const ratio = document.getElementById('ratioSelect').value.split('x');
            const width = ratio[0];
            const height = ratio[1];

            loader.style.display = 'block';
            mainImg.style.opacity = '0.3';
            mainVideo.style.display = 'none';

            const fullPrompt = encodeURIComponent(`${prompt}, ${style}`);
            const seed = Math.floor(Math.random() * 999999);
            const aiImageUrl = `https://image.pollinations.ai/prompt/${fullPrompt}?width=${width}&height=${height}&seed=${seed}&nologo=true`;

            const tempImg = new Image();
            tempImg.src = aiImageUrl;
            tempImg.onload = function() {
                mainImg.src = aiImageUrl;
                mainImg.style.display = 'block';
                mainImg.style.opacity = '1';
                loader.style.display = 'none';
            };
            tempImg.onerror = function() {
                alert("Image generate karne me dikkat aayi. Kripya dobara try karein.");
                mainImg.style.opacity = '1';
                loader.style.display = 'none';
            };
        }

        function generateVideo() {
