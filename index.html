<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PixoraAI - AI Image & Video Studio</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0b0c1b;
            color: #ffffff;
            overflow-x: hidden;
        }

        /* Header */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 6%;
            background: rgba(11, 12, 27, 0.9);
            backdrop-filter: blur(10px);
            position: sticky;
            top: 0;
            z-index: 1000;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .logo {
            font-size: 24px;
            font-weight: 700;
            background: linear-gradient(90deg, #a855f7, #6366f1);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .user-circle-btn {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            background: #1e1b4b;
            border: 2px solid #6366f1;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #a855f7;
            cursor: pointer;
            transition: 0.3s;
            overflow: hidden;
        }

        .user-circle-btn img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* Main Container (Top-to-Bottom Layout) */
        .main-container {
            max-width: 950px;
            margin: 0 auto;
            padding: 30px 20px 60px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Top Header Text Section */
        .hero-top {
            text-align: center;
            margin-bottom: 30px;
            max-width: 700px;
        }

        .badge {
            background: rgba(99, 102, 241, 0.15);
            color: #a855f7;
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 13px;
            display: inline-block;
            margin-bottom: 14px;
            border: 1px solid rgba(168, 85, 247, 0.3);
            font-weight: 500;
        }

        .hero-title {
            font-size: 38px;
            line-height: 1.25;
            margin-bottom: 12px;
            font-weight: 800;
            letter-spacing: -0.5px;
        }

        .hero-title span {
            background: linear-gradient(90deg, #38bdf8, #818cf8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .hero-desc {
            color: #94a3b8;
            font-size: 15px;
            line-height: 1.6;
        }

        /* Full-Width AI Studio Card */
        .studio-card {
            width: 100%;
            background: #131129;
            padding: 24px;
            border-radius: 20px;
            border: 1px solid #2e285a;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.4);
        }

        .preview-container {
            display: flex;
            gap: 16px;
            margin-bottom: 20px;
        }

        .main-preview {
            flex: 3.5;
            position: relative;
            height: 380px;
            border-radius: 14px;
            overflow: hidden;
            background: #000;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid #252047;
        }

        .main-preview img, .main-preview video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: opacity 0.4s ease;
        }

        .main-preview video {
            display: none;
        }

        .loading-spinner {
            display: none;
            position: absolute;
            color: #a855f7;
            font-size: 38px;
            z-index: 5;
        }

        .preview-badge {
            position: absolute;
            top: 12px;
            left: 12px;
            background: rgba(0, 0, 0, 0.75);
            padding: 5px 10px;
            font-size: 11px;
            border-radius: 6px;
            font-weight: 700;
            z-index: 4;
            backdrop-filter: blur(4px);
            border: 1px solid rgba(255,255,255,0.1);
        }

        .side-thumbnails {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 10px;
            justify-content: space-between;
        }

        .thumb {
            width: 100%;
            height: 116px;
            border-radius: 10px;
            object-fit: cover;
            cursor: pointer;
            border: 2px solid transparent;
            transition: 0.2s transform, 0.2s border-color;
        }

        .thumb:hover {
            transform: scale(1.03);
        }

        .thumb.active {
            border-color: #8b5cf6;
        }

        /* Controls Grid */
        .control-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 14px;
        }

        .select-field {
            background: #1c1936;
            border: 1px solid #3730a3;
            color: #cbd5e1;
            padding: 12px 15px;
            border-radius: 10px;
            font-size: 14px;
            outline: none;
            width: 100%;
            cursor: pointer;
        }

        .prompt-container {
            margin-bottom: 16px;
        }

        .prompt-input {
            width: 100%;
            background: #1c1936;
            border: 1px solid #3730a3;
            border-radius: 10px;
            padding: 14px 18px;
            color: #ffffff;
            font-size: 15px;
            outline: none;
        }

        .prompt-input:focus, .script-input:focus, .select-field:focus {
            border-color: #8b5cf6;
        }

        .script-input {
            width: 100%;
            background: #1c1936;
            border: 1px solid #3730a3;
            border-radius: 10px;
            padding: 14px 18px;
            color: #ffffff;
            font-size: 15px;
            outline: none;
            height: 120px;
            resize: none;
            display: none;
        }

        .action-row {
            display: flex;
            gap: 12px;
        }

        .btn-gen {
            flex: 1.2;
            background: linear-gradient(90deg, #8b5cf6, #6366f1);
            border: none;
            color: #fff;
            padding: 14px;
            border-radius: 10px;
            font-weight: 700;
            font-size: 15px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            transition: 0.3s opacity;
        }

        .btn-gen:hover {
            opacity: 0.92;
        }

        .btn-down {
            flex: 1;
            background: #1e1b4b;
            border: 1px solid #6366f1;
            color: #a855f7;
            padding: 14px;
            border-radius: 10px;
            font-weight: 700;
            font-size: 15px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            transition: 0.3s background;
        }

        .btn-down:hover {
            background: #282460;
        }

        /* Footer */
        footer {
            padding: 30px 6%;
            background: #080811;
            border-top: 1px solid #1a1830;
            text-align: center;
            color: #64748b;
            font-size: 14px;
        }

        footer strong {
            color: #a855f7;
        }

        /* Responsive View for Mobile Devices */
        @media (max-width: 768px) {
            .hero-title {
                font-size: 30px;
            }
            .preview-container {
                flex-direction: column;
            }
            .main-preview {
                height: 250px;
            }
            .side-thumbnails {
                flex-direction: row;
            }
            .thumb {
                height: 70px;
            }
            .control-grid {
                grid-template-columns: 1fr;
            }
            .select-field {
                grid-column: span 1 !important;
            }
        }
    </style>
    <!-- Google Identity Services Library -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>

    <header>
        <div class="logo">PixoraAI</div>
        <div class="nav-right">
            <div class="user-circle-btn" id="userBtn" onclick="toggleAuth()" title="User Profile. Click to Login.">
                <i class="fa-solid fa-user" id="authIcon"></i>
            </div>
        </div>
    </header>

    <div class="main-container">
        <!-- Top Text Section -->
        <div class="hero-top">
            <div class="badge"><i class="fa-solid fa-wand-magic-sparkles"></i> AI 4K Generation Studio</div>
            <h1 class="hero-title">Create Stunning <span>AI Visuals</span></h1>
            <p class="hero-desc">
                Type your prompt or script below, choose your style and format, and click Generate to create high-resolution content instantly.
            </p>
        </div>

        <!-- Full-Width Studio Card -->
        <div class="studio-card">
            <div class="preview-container">
                <div class="main-preview">
                    <span class="preview-badge" id="resBadge">4K ULTRA HD</span>
                    <i class="fa-solid fa-spinner fa-spin loading-spinner" id="loader"></i>
                    
                    <video id="mainVideo" controls></video>
                    <img id="mainImage" src="https://image.pollinations.ai/prompt/hyperrealistic%20lion%20and%20bear%20nature%20cinematic%204k?width=800&height=500&nologo=true" alt="Main Output">
                </div>
                <div class="side-thumbnails">
                    <img class="thumb active" src="https://image.pollinations.ai/prompt/cyberpunk%20warrior%20anime%204k?width=200&height=140&nologo=true" onclick="selectThumb(this)">
                    <img class="thumb" src="https://image.pollinations.ai/prompt/scifi%20futuristic%20city%204k?width=200&height=140&nologo=true" onclick="selectThumb(this)">
                    <img class="thumb" src="https://image.pollinations.ai/prompt/magical%20fantasy%20castle%204k?width=200&height=140&nologo=true" onclick="selectThumb(this)">
                </div>
            </div>

            <div class="control-grid">
                <select class="select-field" id="typeSelect" onchange="toggleInputMode()">
                    <option value="image">Text to Image</option>
                    <option value="video">Text to Video</option>
                </select>

                <select class="select-field" id="ratioSelect">
                    <option value="1280x720">YouTube (16:9 4K)</option>
                    <option value="720x1280">YouTube Shorts / Reels (9:16)</option>
                    <option value="1024x1024">Facebook / Logo (1:1)</option>
                    <option value="1280x720">YouTube Thumbnail</option>
                </select>

                <select class="select-field" id="styleSelect" style="grid-column: span 2;">
                    <option value="ultra realistic, 8k photography, sharp focus">Ultra Realistic</option>
                    <option value="cinematic movie lighting, 4k render">Cinematic Movie Style</option>
                    <option value="3D Pixar animation cartoon style">Cartoon / 3D Animation</option>
                    <option value="dramatic lighting story cinematic">Cinematic Story</option>
                </select>
            </div>

            <div class="prompt-container">
                <input type="text" id="promptText" class="prompt-input" value="Prompt" onfocus="if(this.value=='Prompt')this.value=''" placeholder="Enter what you want to create...">
                <textarea id="scriptText" class="script-input" placeholder="Enter your full story script here (up to 10 minutes)..."></textarea>
            </div>

            <div class="action-row">
                <button class="btn-gen" onclick="generateAsset()"><i class="fa-solid fa-wand-magic-sparkles"></i> Generate</button>
                <button class="btn-down" onclick="downloadAsset()"><i class="fa-solid fa-download"></i> Download</button>
            </div>
        </div>
    </div>

    <footer>
        <p>© 2026 PixoraAI Studio. All rights reserved.</p>
        <p style="margin-top: 8px;">Website Created & Developed by: <strong>Kamlesh Meena</strong></p>
    </footer>

    <script>
        // --- GOOGLE CLIENT ID ---
        const GOOGLE_CLIENT_ID = "239528284719-gt2p1g7mgqn5ufl7pjfcj1i2c36p14pj.apps.googleusercontent.com"; 

        const mainImg = document.getElementById('mainImage');
        const mainVideo = document.getElementById('mainVideo');
        const loader = document.getElementById('loader');
        const typeSelect = document.getElementById('typeSelect');
        const promptInput = document.getElementById('promptText');
        const scriptInput = document.getElementById('scriptText');
        const userBtn = document.getElementById('userBtn');

        window.onload = function () {
            initializeGoogleSignIn();
            const savedUser = localStorage.getItem('pixoraUser');
            if (savedUser) {
                const user = JSON.parse(savedUser);
                updateUIForLoggedInUser(user);
            }
        };

        function initializeGoogleSignIn() {
            if (window.google) {
                google.accounts.id.initialize({
                    client_id: GOOGLE_CLIENT_ID,
                    callback: handleCredentialResponse,
                    auto_select: false
                });
            }
        }

        function handleCredentialResponse(response) {
            const responsePayload = parseJwt(response.credential);
            const userData = {
                name: responsePayload.name,
                email: responsePayload.email,
                picture: responsePayload.picture
            };
            localStorage.setItem('pixoraUser', JSON.stringify(userData));
            updateUIForLoggedInUser(userData);
            alert("Safaltapurvak login hua: " + userData.name);
        }

        function updateUIForLoggedInUser(user) {
            userBtn.innerHTML = `<img src="${user.picture}" alt="${user.name}">`;
            userBtn.title = `Logged in as ${user.name} (${user.email}). Click to Logout.`;
            userBtn.setAttribute('onclick', 'handleLogout()');
        }

        function toggleAuth() {
            if (window.google) {
                google.accounts.id.prompt();
            } else {
                alert("Google Sign-In load ho raha hai, kripya 2 second ruk kar dubara click karein.");
            }
        }

        function handleLogout() {
            const confirmLogout = confirm("Kya aap logout karna chahte hain?");
            if (confirmLogout) {
                localStorage.removeItem('pixoraUser');
                google.accounts.id.disableAutoSelect();
                userBtn.innerHTML = `<i class="fa-solid fa-user" id="authIcon"></i>`;
                userBtn.title = "User Profile. Click to Login.";
                userBtn.setAttribute('onclick', 'toggleAuth()');
                alert("Aap logout ho gaye hain.");
            }
        }

        function parseJwt(token) {
            var base64Url = token.split('.')[1];
            var base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
            var jsonPayload = decodeURIComponent(atob(base64).split('').map(function(c) {
                return '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2);
            }).join(''));
            return JSON.parse(jsonPayload);
        }

        function toggleInputMode() {
            if (typeSelect.value === 'video') {
                promptInput.style.display = 'none';
                scriptInput.style.display = 'block';
                scriptInput.value = "Script";
            } else {
                promptInput.style.display = 'block';
                scriptInput.style.display = 'none';
                promptInput.value = "Prompt";
            }
        }

        function generateAsset() {
            if (typeSelect.value === 'image') {
                generateImage();
            } else {
                generateVideo();
            }
        }

        function generateImage() {
            let prompt = promptInput.value.trim();
            if (!prompt || prompt === "Prompt") {
                alert("Kripya prompt bar me kuch likhein!");
                return;
            }

            const style = document.getElementById('styleSelect').value;
            const ratio = document.getElementById('ratioSelect').value.split('x');
            const width = ratio[0];
            const height = ratio[1];

            loader.style.display = 'block';
            mainImg.style.opacity = '0.3';
            mainVideo.style.display = 'none';

            const fullPrompt = encodeURIComponent(`${prompt}, ${style}`);
            const seed = Math.floor(Math.random() * 999999);
            const aiImageUrl = `https://image.pollinations.ai/prompt/${fullPrompt}?width=${width}&height=${height}&seed=${seed}&nologo=true`;

            const tempImg = new Image();
            tempImg.src = aiImageUrl;
            tempImg.onload = function() {
                mainImg.src = aiImageUrl;
                mainImg.style.display = 'block';
                mainImg.style.opacity = '1';
                loader.style.display = 'none';
            };
            tempImg.onerror = function() {
                alert("Image generate karne me dikkat aayi. Kripya dobara try karein.");
                mainImg.style.opacity = '1';
                loader.style.display = 'none';
            };
        }

        function generateVideo() {
            let script = scriptInput.value.trim();
            if (!script || script === "Script") {
                alert("Kripya script area me apni kahani likhein!");
                return;
            }

            loader.style.display = 'block';
            mainImg.style.display = 'none';
            mainVideo.style.display = 'none';

            setTimeout(() => {
                loader.style.display = 'none';
                mainVideo.src = "https://cdn.pixabay.com/video/2017/01/29/7542-200732313_tiny.mp4"; 
                mainVideo.style.display = 'block';
                mainVideo.play();
                alert("Realistic video story generate ho gayi hai!");
            }, 3000); 
        }

        async function downloadAsset() {
            let currentSrc = (typeSelect.value === 'image') ? mainImg.src : mainVideo.src;
            try {
                const response = await fetch(currentSrc);
                const blob = await response.blob();
                const blobUrl = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = blobUrl;
                a.download = `AI_Creation_${Date.now()}.${typeSelect.value === 'image' ? 'jpg' : 'mp4'}`;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(blobUrl);
            } catch (error) {
                window.open(currentSrc, '_blank');
            }
        }

        function selectThumb(element) {
