<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PixoraAI - AI Image & Video Studio</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0b0c1b;
            color: #ffffff;
            overflow-x: hidden;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 8%;
            background: rgba(11, 12, 27, 0.85);
            backdrop-filter: blur(10px);
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .logo {
            font-size: 24px;
            font-weight: 700;
            background: linear-gradient(90deg, #a855f7, #6366f1);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        nav a {
            color: #94a3b8;
            text-decoration: none;
            margin: 0 15px;
            font-size: 14px;
            transition: 0.3s;
        }

        nav a:hover {
            color: #ffffff;
        }

        .nav-right {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .user-circle-btn {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            background: #1e1b4b;
            border: 2px solid #6366f1;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #a855f7;
            cursor: pointer;
            transition: 0.3s;
        }

        .hero {
            display: flex;
            flex-wrap: wrap;
            padding: 50px 8%;
            gap: 40px;
            align-items: center;
            justify-content: space-between;
        }

        .hero-left {
            flex: 1;
            min-width: 320px;
        }

        .badge {
            background: rgba(99, 102, 241, 0.15);
            color: #a855f7;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 12px;
            display: inline-block;
            margin-bottom: 20px;
            border: 1px solid rgba(168, 85, 247, 0.3);
        }

        .hero-title {
            font-size: 42px;
            line-height: 1.2;
            margin-bottom: 15px;
            font-weight: 800;
        }

        .hero-title span {
            background: linear-gradient(90deg, #38bdf8, #818cf8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .hero-desc {
            color: #94a3b8;
            font-size: 15px;
            margin-bottom: 25px;
            line-height: 1.6;
        }

        .hero-right {
            flex: 1;
            min-width: 340px;
            background: #131129;
            padding: 20px;
            border-radius: 16px;
            border: 1px solid #2e285a;
        }

        .preview-container {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
        }

        .main-preview {
            flex: 3;
            position: relative;
            height: 280px;
            border-radius: 12px;
            overflow: hidden;
            background: #000;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .main-preview img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: opacity 0.5s;
        }

        .loading-spinner {
            display: none;
            position: absolute;
            color: #a855f7;
            font-size: 32px;
            z-index: 5;
        }

        .preview-badge {
            position: absolute;
            top: 10px;
            left: 10px;
            background: rgba(0,0,0,0.7);
            padding: 4px 8px;
            font-size: 10px;
            border-radius: 4px;
            font-weight: 700;
            z-index: 4;
        }

        .side-thumbnails {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .thumb {
            width: 100%;
            height: 60px;
            border-radius: 8px;
            object-fit: cover;
            cursor: pointer;
            border: 2px solid transparent;
        }

        .thumb.active {
            border-color: #8b5cf6;
        }

        .control-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 15px;
        }

        .select-field {
            background: #1c1936;
            border: 1px solid #3730a3;
            color: #cbd5e1;
            padding: 8px 12px;
            border-radius: 8px;
            font-size: 13px;
            outline: none;
            width: 100%;
        }

        .prompt-container {
            margin-bottom: 15px;
        }

        .prompt-input {
            width: 100%;
            background: #1c1936;
            border: 1px solid #3730a3;
            border-radius: 10px;
            padding: 12px 15px;
            color: #ffffff;
            font-size: 14px;
            outline: none;
        }

        .action-row {
            display: flex;
            gap: 10px;
        }

        .btn-gen {
            flex: 1;
            background: linear-gradient(90deg, #8b5cf6, #6366f1);
            border: none;
            color: #fff;
            padding: 12px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-down {
            flex: 1;
            background: #1e1b4b;
            border: 1px solid #6366f1;
            color: #a855f7;
            padding: 12px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        footer {
            margin-top: 50px;
            padding: 30px 8%;
            background: #080811;
            border-top: 1px solid #1a1830;
            text-align: center;
            color: #64748b;
            font-size: 14px;
        }

        footer strong {
            color: #a855f7;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">PixoraAI</div>
        <div class="nav-right">
            <div class="user-circle-btn" onclick="toggleAuth()" title="User Profile">
                <i class="fa-solid fa-user" id="authIcon"></i>
            </div>
        </div>
    </header>

    <div class="hero">
        <div class="hero-left">
            <div class="badge"><i class="fa-solid fa-wand-magic-sparkles"></i> AI 4K Generation Studio</div>
            <h1 class="hero-title">Create Stunning <span>AI Visuals</span></h1>
            <p class="hero-desc">
                Type your prompt below, choose your style and aspect ratio, and click Generate to create high-resolution images instantly.
            </p>
        </div>

        <div class="hero-right">
            <div class="preview-container">
                <div class="main-preview">
                    <span class="preview-badge" id="resBadge">4K ULTRA HD</span>
                    <i class="fa-solid fa-spinner fa-spin loading-spinner" id="loader"></i>
                    <img id="mainImage" src="https://image.pollinations.ai/prompt/hyperrealistic%20lion%20and%20bear%20nature%20cinematic%204k?width=600&height=400&nologo=true" alt="Main Output">
                </div>
                <div class="side-thumbnails">
                    <img class="thumb active" src="https://image.pollinations.ai/prompt/cyberpunk%20warrior%20anime%204k?width=150&height=100&nologo=true" onclick="selectThumb(this)">
                    <img class="thumb" src="https://image.pollinations.ai/prompt/scifi%20futuristic%20city%204k?width=150&height=100&nologo=true" onclick="selectThumb(this)">
                    <img class="thumb" src="https://image.pollinations.ai/prompt/magical%20fantasy%20castle%204k?width=150&height=100&nologo=true" onclick="selectThumb(this)">
                </div>
            </div>

            <div class="control-grid">
                <select class="select-field" id="typeSelect">
                    <option value="image">Text to Image</option>
                    <option value="video">Text to Video (Storyboard)</option>
                </select>

                <select class="select-field" id="ratioSelect">
                    <option value="1280x720">YouTube (16:9 4K)</option>
                    <option value="720x1280">YouTube Shorts / Reels (9:16)</option>
                    <option value="1024x1024">Facebook / Logo (1:1)</option>
                    <option value="1280x720">YouTube Thumbnail</option>
                </select>

                <select class="select-field" id="styleSelect" style="grid-column: span 2;">
                    <option value="ultra realistic, 8k photography, sharp focus">Ultra Realistic</option>
                    <option value="cinematic movie lighting, 4k render">Cinematic Movie Style</option>
                    <option value="3D Pixar animation cartoon style">Cartoon / 3D Animation</option>
                    <option value="dramatic lighting story cinematic">Cinematic Story</option>
                </select>
            </div>

            <!-- Prompt Box with Default text 'Prompt' -->
            <div class="prompt-container">
                <input type="text" id="promptText" class="prompt-input" value="Prompt" onfocus="if(this.value=='Prompt')this.value=''" placeholder="Enter what you want to create...">
            </div>

            <div class="action-row">
                <button class="btn-gen" onclick="generateAsset()"><i class="fa-solid fa-wand-magic-sparkles"></i> Generate</button>
                <button class="btn-down" onclick="downloadAsset()"><i class="fa-solid fa-download"></i> Download</button>
            </div>
        </div>
    </div>

    <footer>
        <p>© 2026 PixoraAI Studio. All rights reserved.</p>
        <p style="margin-top: 8px;">Website Created & Developed by: <strong>Kamlesh Meena</strong></p>
    </footer>

    <script>
        const mainImg = document.getElementById('mainImage');
        const loader = document.getElementById('loader');

        // Real AI Generator Function
        function generateAsset() {
            let prompt = document.getElementById('promptText').value.trim();
            if (!prompt || prompt === "Prompt") {
                alert("Kripya prompt bar me kuch likhein!");
                return;
            }

            const style = document.getElementById('styleSelect').value;
            const ratio = document.getElementById('ratioSelect').value.split('x');
            const width = ratio[0];
            const height = ratio[1];

            // Show loading animation
            loader.style.display = 'block';
            mainImg.style.opacity = '0.3';

            const fullPrompt = encodeURIComponent(`${prompt}, ${style}`);
            const seed = Math.floor(Math.random() * 999999);
            const aiImageUrl = `https://image.pollinations.ai/prompt/${fullPrompt}?width=${width}&height=${height}&seed=${seed}&nologo=true`;

            // Preload generated image
            const tempImg = new Image();
            tempImg.src = aiImageUrl;
            tempImg.onload = function() {
                mainImg.src = aiImageUrl;
                mainImg.style.opacity = '1';
                loader.style.display = 'none';
            };
            tempImg.onerror = function() {
                alert("Image generate karne me dikkat aayi. Kripya dobara try karein.");
                mainImg.style.opacity = '1';
                loader.style.display = 'none';
            };
        }

        // Direct Download Image Function
        async function downloadAsset() {
            const currentSrc = mainImg.src;
            try {
                const response = await fetch(currentSrc);
                const blob = await response.blob();
                const blobUrl = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = blobUrl;
                a.download = `AI_Creation_${Date.now()}.jpg`;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(blobUrl);
            } catch (error) {
                window.open(currentSrc, '_blank');
            }
        }

        function selectThumb(element) {
            document.querySelectorAll('.thumb').forEach(t => t.classList.remove('active'));
            element.classList.add('active');
            mainImg.src = element.src;
        }

        let isLogged = false;
        function toggleAuth() {
            isLogged = !isLogged;
            const icon = document.getElementById('authIcon');
            icon.className = isLogged ? 'fa-solid fa-right-from-bracket' : 'fa-solid fa-user';
        }
    </script>
</body>
</html>
