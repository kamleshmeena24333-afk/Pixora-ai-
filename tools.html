<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pixora AI — AI Image Editor & Tools</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  
  <style>
    :root {
      --bg-dark: #080c14;
      --bg-card: #0e1526;
      --bg-sidebar: #0a0f1d;
      --border-color: rgba(255, 255, 255, 0.08);
      --accent-indigo: #6366f1;
      --accent-hover: #4f46e5;
      --text-white: #f8fafc;
      --text-muted: #94a3b8;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Plus Jakarta Sans', sans-serif;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-white);
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* Top Navbar */
    .navbar {
      height: 60px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 2rem;
      background: var(--bg-sidebar);
      border-bottom: 1px solid var(--border-color);
      z-index: 50;
    }

    .brand-logo {
      font-size: 1.25rem;
      font-weight: 700;
      color: #fff;
      text-decoration: none;
    }

    .nav-center {
      display: flex;
      gap: 2rem;
      list-style: none;
    }

    .nav-center a {
      color: var(--text-muted);
      text-decoration: none;
      font-size: 0.95rem;
      font-weight: 500;
      padding-bottom: 4px;
      transition: color 0.2s;
    }

    .nav-center a:hover {
      color: #fff;
    }

    .nav-center a.active {
      color: #fff;
      border-bottom: 2px solid var(--accent-indigo);
    }

    .nav-actions {
      display: flex;
      align-items: center;
      gap: 1.25rem;
    }

    .nav-actions .login-link {
      color: #fff;
      text-decoration: none;
      font-size: 0.9rem;
      font-weight: 500;
    }

    .btn-signup {
      background: var(--accent-indigo);
      color: #fff;
      text-decoration: none;
      padding: 0.45rem 1.2rem;
      border-radius: 6px;
      font-size: 0.9rem;
      font-weight: 600;
      transition: background 0.2s;
    }

    .btn-signup:hover {
      background: var(--accent-hover);
    }

    /* Workspace Body */
    .editor-layout {
      flex: 1;
      display: flex;
      height: calc(100vh - 110px);
    }

    /* Left Toolbar */
    .left-toolbar {
      width: 60px;
      background: var(--bg-sidebar);
      border-right: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 1rem 0;
      gap: 1.5rem;
    }

    .tool-btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-size: 1.15rem;
      cursor: pointer;
      width: 40px;
      height: 40px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
    }

    .tool-btn:hover, .tool-btn.active {
      color: #fff;
      background: rgba(255, 255, 255, 0.05);
    }

    /* Center Canvas Area */
    .canvas-workspace {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      position: relative;
      background: #060911;
    }

    .drop-zone {
      width: 80%;
      max-width: 680px;
      height: 440px;
      border: 2px dashed rgba(255, 255, 255, 0.15);
      border-radius: 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: border-color 0.2s, background-color 0.2s;
      position: relative;
    }

    .drop-zone:hover {
      border-color: var(--accent-indigo);
      background-color: rgba(99, 102, 241, 0.02);
    }

    .upload-icon-circle {
      width: 60px;
      height: 60px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.05);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.5rem;
      color: var(--text-muted);
      margin-bottom: 1.25rem;
    }

    .drop-zone h3 {
      font-size: 1.25rem;
      font-weight: 600;
      margin-bottom: 0.5rem;
    }

    .drop-zone p {
      color: var(--text-muted);
      font-size: 0.9rem;
      margin-bottom: 1.5rem;
    }

    .file-badges {
      display: flex;
      gap: 0.75rem;
    }

    .file-badge {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border-color);
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 0.75rem;
      color: var(--text-muted);
      font-weight: 600;
    }

    /* Preview Image on Canvas */
    #image-preview {
      display: none;
      max-width: 90%;
      max-height: 90%;
      object-fit: contain;
      border-radius: 8px;
    }

    /* Right Control Sidebar */
    .right-sidebar {
      width: 320px;
      background: var(--bg-sidebar);
      border-left: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
      overflow-y: auto;
    }

    .tab-header {
      display: flex;
      border-bottom: 1px solid var(--border-color);
    }

    .tab-btn {
      flex: 1;
      padding: 0.85rem;
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-weight: 600;
      font-size: 0.85rem;
      cursor: pointer;
      text-align: center;
    }

    .tab-btn.active {
      color: #fff;
      border-bottom: 2px solid var(--accent-indigo);
    }

    .sidebar-section {
      padding: 1.5rem;
    }

    .section-title {
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.5px;
      color: var(--text-muted);
      margin-bottom: 1rem;
      text-transform: uppercase;
    }

    /* Magic Tools Grid */
    .magic-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.75rem;
      margin-bottom: 2rem;
    }

    .magic-card {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 10px;
      padding: 1.1rem 0.5rem;
      text-align: center;
      text-decoration: none;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all 0.2s;
      cursor: pointer;
    }

    .magic-card:hover {
      border-color: var(--accent-indigo);
      background: rgba(99, 102, 241, 0.08);
      transform: translateY(-2px);
    }

    .magic-card i {
      font-size: 1.25rem;
      color: var(--text-white);
    }

    .magic-card span {
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--text-white);
    }

    /* Adjustments Sliders */
    .control-group {
      margin-bottom: 1.25rem;
    }

    .control-label {
      display: flex;
      justify-content: space-between;
      font-size: 0.85rem;
      font-weight: 500;
      margin-bottom: 0.5rem;
    }

    .control-label span:last-child {
      color: var(--text-muted);
    }

    input[type=range] {
      width: 100%;
      height: 4px;
      border-radius: 2px;
      background: rgba(255, 255, 255, 0.1);
      outline: none;
      -webkit-appearance: none;
    }

    input[type=range]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: #818cf8;
      cursor: pointer;
    }

    /* Bottom Control Bar */
    .bottom-bar {
      height: 50px;
      background: var(--bg-sidebar);
      border-top: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 1.5rem;
      z-index: 50;
    }

    .history-actions {
      display: flex;
      align-items: center;
      gap: 1rem;
    }

    .history-btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      font-size: 0.95rem;
    }

    .history-btn:hover {
      color: #fff;
    }

    .reset-btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-size: 0.85rem;
      cursor: pointer;
      margin-left: 0.5rem;
    }

    .project-name-input {
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-size: 0.85rem;
      font-weight: 500;
      outline: none;
      text-align: center;
    }

    .action-group {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .btn-download {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border-color);
      color: #fff;
      padding: 0.35rem 1rem;
      border-radius: 6px;
      font-size: 0.85rem;
      font-weight: 500;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .btn-download:hover {
      background: rgba(255, 255, 255, 0.1);
    }

    .btn-save {
      background: var(--accent-indigo);
      color: #fff;
      border: none;
      padding: 0.35rem 1.1rem;
      border-radius: 6px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .btn-save:hover {
      background: var(--accent-hover);
    }
  </style>
</head>
<body>

  <!-- Top Navbar -->
  <header class="navbar">
    <a href="index.html" class="brand-logo">Pixora AI</a>
    
    <ul class="nav-center">
      <li><a href="index.html">Home</a></li>
      <li><a href="tools.html" class="active">AI Tools</a></li>
      <li><a href="pricing.html">Pricing</a></li>
    </ul>

    <div class="nav-actions">
      <a href="login.html" class="login-link">Login</a>
      <a href="signup.html" class="btn-signup">Sign Up</a>
    </div>
  </header>

  <!-- Workspace Container -->
  <div class="editor-layout">
    
    <!-- Left Toolbar -->
    <aside class="left-toolbar">
      <button class="tool-btn active" title="Crop"><i class="fa-solid fa-crop"></i></button>
      <button class="tool-btn" title="Expand"><i class="fa-regular fa-square-full"></i></button>
      <button class="tool-btn" title="Rotate" onclick="rotateImage()"><i class="fa-solid fa-rotate-right"></i></button>
      <button class="tool-btn" title="Compare Slider"><i class="fa-solid fa-table-columns"></i></button>
      <button class="tool-btn" title="Add Text"><i class="fa-solid fa-t"></i></button>
      <button class="tool-btn" title="Shapes & Elements"><i class="fa-solid fa-shapes"></i></button>
    </aside>

    <!-- Center Canvas Area -->
    <main class="canvas-workspace">
      <!-- Hidden file input for upload -->
      <input type="file" id="file-uploader" accept="image/png, image/jpeg, image/webp" style="display: none;">
      
      <!-- Drag and Drop Box -->
      <div class="drop-zone" id="drop-zone" onclick="document.getElementById('file-uploader').click()">
        <div class="upload-icon-circle">
          <i class="fa-solid fa-cloud-arrow-up"></i>
        </div>
        <h3>Drag & drop your image here</h3>
        <p>or click to browse from your computer</p>
        <div class="file-badges">
          <span class="file-badge">JPG</span>
          <span class="file-badge">PNG</span>
          <span class="file-badge">WEBP</span>
        </div>
      </div>

      <!-- Live Canvas Image -->
      <img id="image-preview" alt="Canvas Workspace Image">
    </main>

    <!-- Right Sidebar (Tools & Controls) -->
    <aside class="right-sidebar">
      <div class="tab-header">
        <button class="tab-btn active">AI Tools</button>
        <button class="tab-btn">Adjust</button>
      </div>

      <div class="sidebar-section">
        <!-- Magic Tools Suite -->
        <h4 class="section-title">MAGIC TOOLS</h4>
        <div class="magic-grid">
          <a href="bg-remover.html" class="magic-card">
            <i class="fa-solid fa-user-xmark"></i>
            <span>Bg Remover</span>
          </a>
          <a href="object-remover.html" class="magic-card">
            <i class="fa-solid fa-eraser"></i>
            <span>Erase Object</span>
          </a>
          <a href="enhancer.html" class="magic-card">
            <i class="fa-solid fa-wand-magic-sparkles"></i>
            <span>AI Enhance</span>
          </a>
          <a href="upscaler.html" class="magic-card">
            <i class="fa-solid fa-expand"></i>
            <span>Upscale</span>
          </a>
        </div>

        <!-- Live Adjustment Controls -->
        <h4 class="section-title">BASIC ADJUSTMENTS</h4>
        
        <div class="control-group">
          <div class="control-label">
            <span>Brightness</span>
            <span id="val-brightness">0</span>
          </div>
          <input type="range" id="input-brightness" min="-100" max="100" value="0">
        </div>

        <div class="control-group">
          <div class="control-label">
            <span>Contrast</span>
            <span id="val-contrast">12</span>
          </div>
          <input type="range" id="input-contrast" min="-100" max="100" value="12">
        </div>

        <div class="control-group">
          <div class="control-label">
            <span>Saturation</span>
            <span id="val-saturation">-5</span>
          </div>
          <input type="range" id="input-saturation" min="-100" max="100" value="-5">
        </div>

      </div>
    </aside>

  </div>

  <!-- Bottom Action Bar -->
  <footer class="bottom-bar">
    <div class="history-actions">
      <button class="history-btn" title="Undo"><i class="fa-solid fa-arrow-rotate-left"></i></button>
      <button class="history-btn" title="Redo"><i class="fa-solid fa-arrow-rotate-right"></i></button>
      <span style="color: var(--border-color);">|</span>
      <button class="reset-btn" onclick="resetAdjustments()">Reset</button>
    </div>

    <div>
      <span style="color: var(--text-muted); font-size: 0.85rem;">Project: </span>
      <input type="text" class="project-name-input" value="Untitled_Image_1">
    </div>

    <div class="action-group">
      <button class="btn-download" onclick="downloadImage()"><i class="fa-solid fa-download"></i> Download</button>
      <button class="btn-save" onclick="saveProject()"><i class="fa-regular fa-floppy-disk"></i> Save Project</button>
    </div>
  </footer>

  <script>
    const fileUploader = document.getElementById('file-uploader');
    const dropZone = document.getElementById('drop-zone');
    const imagePreview = document.getElementById('image-preview');

    const inputBrightness = document.getElementById('input-brightness');
    const inputContrast = document.getElementById('input-contrast');
    const inputSaturation = document.getElementById('input-saturation');

    const valBrightness = document.getElementById('val-brightness');
    const valContrast = document.getElementById('val-contrast');
    const valSaturation = document.getElementById('val-saturation');

    let currentRotation = 0;

    // File Upload Handler
    fileUploader.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = (event) => {
          imagePreview.src = event.target.result;
          imagePreview.style.display = 'block';
          dropZone.style.display = 'none';
          applyFilters();
        };
        reader.readAsDataURL(file);
      }
    });

    // Drag and drop handlers
    dropZone.addEventListener('dragover', (e) => {
      e.preventDefault();
      dropZone.style.borderColor = '#6366f1';
    });

    dropZone.addEventListener('dragleave', () => {
      dropZone.style.borderColor = 'rgba(255, 255, 255, 0.15)';
    });

    dropZone.addEventListener('drop', (e) => {
      e.preventDefault();
      const file = e.dataTransfer.files[0];
      if (file) {
        fileUploader.files = e.dataTransfer.files;
        const reader = new FileReader();
        reader.onload = (event) => {
          imagePreview.src = event.target.result;
          imagePreview.style.display = 'block';
          dropZone.style.display = 'none';
          applyFilters();
        };
        reader.readAsDataURL(file);
      }
    });

    // Live Filter Adjustments
    function applyFilters() {
      const b = 100 + parseInt(inputBrightness.value);
      const c = 100 + parseInt(inputContrast.value);
      const s = 100 + parseInt(inputSaturation.value);
      imagePreview.style.filter = `brightness(${b}%) contrast(${c}%) saturate(${s}%)`;
      imagePreview.style.transform = `rotate(${currentRotation}deg)`;
    }

    inputBrightness.addEventListener('input', (e) => {
      valBrightness.textContent = e.target.value;
      applyFilters();
    });

    inputContrast.addEventListener('input', (e) => {
      valContrast.textContent = e.target.value;
      applyFilters();
    });

    inputSaturation.addEventListener('input', (e) => {
      valSaturation.textContent = e.target.value;
      applyFilters();
    });

    function resetAdjustments() {
      inputBrightness.value = 0;
      inputContrast.value = 12;
      inputSaturation.value = -5;
      valBrightness.textContent = '0';
      valContrast.textContent = '12';
      valSaturation.textContent = '-5';
      currentRotation = 0;
      applyFilters();
    }

    function rotateImage() {
      if (imagePreview.style.display === 'block') {
        currentRotation = (currentRotation + 90) % 360;
        applyFilters();
      }
    }

    function saveProject() {
      alert("Project saved successfully to your Pixora Studio account! [Developed by Kamlesh Meena]");
    }

    function downloadImage() {
      if (imagePreview.src) {
        const a = document.createElement('a');
        a.href = imagePreview.src;
        a.download = 'Pixora_Edited_Image.png';
        a.click();
      } else {
        alert("Please upload an image first.");
      }
    }
  </script>
</body>
  </html>
